name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "FFP-*"
  pull_request:
    branches:
      - main
      - deployment-readiness

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root_user
          POSTGRES_PASSWORD: root_password
          POSTGRES_DB: ffp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Setup test database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: root_user
          PGPASSWORD: root_password
          PGDATABASE: ffp_test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ffp_test
          DB_TLS_MODE: local
          DB_MIGRATE_USER: migrator
          DB_MIGRATE_PASSWORD: migrator_password
          DB_USER: app_user
          ENVIRONMENT: development
        run: |
          # The test role exists only where tests run (no BYPASSRLS, so RLS policies apply)
          psql -c "CREATE USER test_user WITH PASSWORD 'test_password';"
          psql -c "GRANT CONNECT ON DATABASE ffp_test TO test_user;"
          psql -c "GRANT USAGE ON SCHEMA public TO test_user;"

          # Stand-in for the RDS master user: not a superuser, owns the database
          psql -c "CREATE ROLE ci_master WITH LOGIN CREATEROLE CREATEDB PASSWORD 'ci_master_password';"
          psql -c "ALTER DATABASE ffp_test OWNER TO ci_master;"

          cd packages/database

          # The migrator and runtime roles come from the same script a deployed environment runs
          DB_MASTER_USER=ci_master DB_MASTER_PASSWORD=ci_master_password DB_PASSWORD=app_password pnpm db:roles

          # Schema + RLS policies + grants, as the migrator; the test role opts in to the grants
          DB_TEST_USER=test_user pnpm db:migrate

      - name: Test
        run: pnpm test
